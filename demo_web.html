    <script>
        $(function () {
            var gallery_data = [{
                    "img_name": "01",
                    "title": "",
                    "narrative": "",
                    "url": "demo_web/shop/index.html"
                },
                {
                    "img_name": "19",
                    "title": "",
                    "narrative": "",
                    "url": "http://www.ghwn.com.tw/"
                },
                {
                    "img_name": "13",
                    "title": "",
                    "narrative": "",
                    "url": "demo_web/01/index.html"
                },
                {
                    "img_name": "23",
                    "title": "",
                    "narrative": "",
                    "url": "https://www.century21.com.tw/buy/all-city/all-district/residence"
                },
            ];

            var htmlStr = "";
            var i = 4;

            //取2位元不足補0 - start
            function bit2(num, length) {
                if ((num + "").length >= length) {
                    return num;
                }
                return bit2("0" + num, length)
            }
            //取2位元不足補0 - end
            var works_num = bit2(i, 2);

            $.each(gallery_data, function (key, obj) {
                gallery_img_html = '<img class="img-responsive" src="images/works/' + works_num +
                    '/' + obj.img_name + '.jpg">';
                htmlStr +=
                    '<li class="works_img_frame" data-src="images/works/' + works_num + '/' + obj
                    .img_name + '.jpg" data-sub-html="<h4>' + obj.title + '</h4><p>' + obj.narrative +
                    '</p>">';
                htmlStr += '<a href="' + obj.url + '" target="_blank">';
                htmlStr += gallery_img_html;
                htmlStr += '</a>';
                htmlStr += '</li>';
                i++;
            });

            $('#lightgallery').html(htmlStr);
        });

        $(document).ready(function () {
            $('#lightgallery').lightGallery();
        });
    </script>
