<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <title>元件</title>
    <style>
        /* 返回 & coming_soon */
        a.btn_return {
            width: 60px;
            padding: 3px 10px;
            margin: 10px 0;
            text-align: center;
            display: block;
            color: #fff;
            font-size: 14px;
            background: #aaa;
            text-decoration: none;
            border-radius: 30px;
            transition: .3s;
        }

        a.btn_return:hover {
            background: #ff9600;
        }

        .coming_soon {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coming_soon img {
            min-width: 700px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <a class="btn_return" href="">返 回</a>

    <div class="coming_soon">
        <img class="" src="./imgs/coming_soon.jpg" alt="Coming Soon">
    </div>

</body>

</html>
