<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>資訊中心 - 申請報修</title>
    <link href="./bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="./css/bootstrap.css" rel="stylesheet">

    <link href="./css/base.css" rel="stylesheet">
    <link href="./css/apply_repair.css" rel="stylesheet">

    <style>

    </style>
</head>

<body>
    <nav class="navbar navbar-light navbar-expand-lg fixed-top">

    </nav>

    <main class="page">

        <div class="main_body">

            <div class="content_wrap">
                <a class="btn btn_return" href="project-details.html">
                    <i class="bi bi-chevron-left"></i>
                    返 回
                </a>

                <h4 class="text-center">申請報修</h4>

                <ul class="list_group">
                    <li class="list">
                        <div class="label">物件地址</div>
                        <div class="text">
                            <input class="form-control" type="text" placeholder="請輸入物件地址">
                        </div>
                    </li>
                    <li class="list">
                        <div class="label">問題描述</div>
                        <textarea class=""></textarea>
                    </li>
                </ul>

                <div class="btn_group">
                    <button class="btn" id="success_swt2">
                        一鍵申請報修
                    </button>
                </div>

            </div>

        </div>

        </div>
    </main>
</body>

<script src="./js/jquery_3.6.0.js"></script>
<script src="./js/bootstrap.min.js"></script>
<!-- 主選單 -->
<!-- <script src="./js/navbar.js"></script> -->
<script src="./js/function.js"></script>
<!-- 回饋提示窗 -->
<script src="./js/sweetalert2_11.15.3.js"></script>


<script>
    $(document).ready(function () {
        $('#success_swt2').on('click', function (e) {
            Swal.fire({
                title: '成功！',
                text: '操作已成功完成。',
                icon: 'success',
                confirmButtonText: '確定'
            });
        });

        $('#error_swt2').on('click', function (e) {
            Swal.fire({
                title: '錯誤！',
                text: '操作有錯誤！',
                icon: 'error',
                confirmButtonText: '確定'
            });
        });
    });
</script>

</html>
